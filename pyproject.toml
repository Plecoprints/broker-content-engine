[project]
name = "bce"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "selectolax>=0.3.21,<0.4",
    "htmldate>=1.9,<2.0",
    "trafilatura>=2.0,<3.0",
    "anthropic>=0.40,<1.0",
]

[project.scripts]
bce = "bce.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
