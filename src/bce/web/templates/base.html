<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Broker Content Engine{% endblock %}</title>
  <script>
    /* Set theme before first paint to avoid a flash of the wrong scheme. */
    (function () {
      try {
        var s = localStorage.getItem("bce-theme");
        if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/sunreef-soft.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/sunreef-soft.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead__inner">
      <a class="brand" href="/" aria-label="Sunreef — Broker Content Engine">
        <span class="maker brand__emblem" aria-hidden="true"></span>
        <img class="brand__logo logo-light" src="/static/sunreef-black.webp" alt="Sunreef" width="110" height="19">
        <img class="brand__logo logo-dark" src="/static/sunreef-white.webp" alt="Sunreef" width="110" height="19">
        <span class="brand__rule" aria-hidden="true"></span>
        <span class="brand__sub">Broker Content Engine<br>Operator Console</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="/"{% if active == "shortlist" %} aria-current="page"{% endif %}>Shortlist</a>
        <a href="/add"{% if active == "add" %} aria-current="page"{% endif %}>Add</a>
      </nav>
      <button class="nm-toggle" id="theme-toggle" type="button" aria-label="Switch colour scheme" data-testid="theme-toggle">
        <span class="nm-toggle__knob"><span class="nm-toggle__dot" aria-hidden="true"></span></span>
      </button>
    </div>
  </header>

  <main class="shell">
    <div class="watermark" aria-hidden="true"></div>
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <div class="shell">
      <div class="foot__inner">
        <span class="maker foot__mark" aria-hidden="true"></span>
        <img class="foot__logo logo-light" src="/static/sunreef-black.webp" alt="Sunreef">
        <img class="foot__logo logo-dark" src="/static/sunreef-white.webp" alt="Sunreef">
        <span>Broker Content Engine</span>
        <span class="spacer"></span>
        <span>Operator Console</span>
      </div>
    </div>
  </footer>
</body>
</html>
