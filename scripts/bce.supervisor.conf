[program:bce]
command=/root/.venv/bin/uvicorn bce.web.asgi:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app/src
directory=/app
environment=BCE_DB_PATH="/app/bce.db",PYTHONPATH="/app/src"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/bce.err.log
stdout_logfile=/var/log/supervisor/bce.out.log
